<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成大西瓜 · 终极丝滑版</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #3a7a4e, #173322);
    display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
  }
  .game-container {
    background: #f5e7c8; padding: 14px 12px 18px;
    border-radius: 42px 42px 28px 28px;
    box-shadow: 0 22px 34px rgba(0,0,0,.55), inset 0 2px 4px rgba(255,255,240,.6);
    border-bottom: 6px solid #b59b6b;
    max-width: 400px; width: 100%; margin: 16px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 8px; gap: 8px; }
  .score-box {
    background: #3d2b1a; color: #ffd966; padding: 5px 16px 6px; border-radius: 40px;
    box-shadow: inset 0 2px 5px #1a120b, 0 3px 0 #1a120b;
    display: flex; flex-direction: column; align-items: center; line-height: 1.15;
    min-width: 96px;
  }
  .score-main { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
  .score-num { display: inline-block; }
  .score-best { font-size: .7rem; color: #e6c28b; letter-spacing: 1px; opacity: .95; }
  .btn-group { display: flex; gap: 8px; align-items: center; }
  .restart-btn, .icon-btn {
    background: #e6c28b; border: none; border-radius: 40px;
    font-size: 1rem; font-weight: 700; color: #3d2b1a; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 4px 0 #a8895a, 0 4px 8px rgba(0,0,0,.3);
    transition: .07s; border-bottom: 2px solid #a8895a;
  }
  .icon-btn { padding: 7px 10px; font-size: 1.05rem; }
  .restart-btn:active, .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8895a; }
  canvas {
    display: block; width: 100%; height: auto; border-radius: 28px; background: #fcf3e2;
    box-shadow: inset 0 0 0 3px #e2cfb0, inset 0 0 20px #bbaa8b;
    cursor: pointer; touch-action: none; margin: 4px 0 6px;
  }
  .hint { text-align: center; font-size: .8rem; color: #6b4f2e; font-weight: 500; padding: 0 5px; }

  /* ---------- 排行榜 ---------- */
  .board-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    padding: 16px;
  }
  .board-overlay[hidden] { display: none; }
  .board-panel {
    background: #f5e7c8; border-radius: 24px; width: 100%; max-width: 340px;
    padding: 16px 16px 14px; box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,240,.6);
    border-bottom: 5px solid #b59b6b; max-height: 84vh;
    display: flex; flex-direction: column;
  }
  .board-title { font-size: 1.15rem; font-weight: 800; color: #3d2b1a; text-align: center; margin-bottom: 8px; }
  .board-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .board-tab {
    flex: 1; border: none; border-radius: 10px; padding: 6px 0; cursor: pointer;
    background: #f0e5d0; color: #6b4f2e; font-size: .85rem; font-weight: 700;
    box-shadow: inset 0 1px 2px rgba(61,43,26,.12); transition: .1s;
  }
  .board-tab.active { background: #6b4f2e; color: #fff; box-shadow: none; }
  .board-tip { text-align: center; font-size: .85rem; color: #7a5a33; font-weight: 600; margin-bottom: 8px; min-height: 1.2em; }
  .board-list { overflow-y: auto; flex: 1; min-height: 120px; }
  .board-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin-bottom: 5px;
    background: #fff8ea; border-radius: 12px; font-size: .9rem; color: #3d2b1a;
    box-shadow: 0 1px 3px rgba(61,43,26,.15);
  }
  .board-row .rk { width: 34px; text-align: center; font-weight: 800; flex-shrink: 0; }
  .board-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .board-row .sc { font-weight: 800; color: #b3541e; }
  .board-row .dt { font-size: .72rem; color: #9c7f55; flex-shrink: 0; }
  .board-row.me { background: #ffd966; outline: 2px solid #c98f1b; }
  .board-row.top1 .rk { color: #d4a017; }
  .board-row.top2 .rk { color: #9aa0a6; }
  .board-row.top3 .rk { color: #b87333; }
  .board-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .board-btn {
    background: #e6c28b; border: none; border-radius: 40px; font-size: .85rem; font-weight: 700;
    color: #3d2b1a; padding: 7px 12px; cursor: pointer; box-shadow: 0 3px 0 #a8895a;
    border-bottom: 2px solid #a8895a; transition: .07s;
  }
  .board-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8895a; }
  .board-cur { font-size: .78rem; color: #6b4f2e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @keyframes scorePop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .score-pop { animation: scorePop .18s ease-out; }
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="score-box">
      <div class="score-main">🍉 <span id="scoreDisplay" class="score-num">0</span></div>
      <div class="score-best">🏆 最高 <span id="bestDisplay">0</span></div>
    </div>
    <div class="btn-group">
      <button type="button" class="icon-btn" id="boardButton" title="排行榜">🏆</button>
      <button type="button" class="icon-btn" id="soundButton" title="音效开关">🔊</button>
      <button type="button" class="restart-btn" id="restartButton">↻ 重开</button>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div class="hint">👆 按住拖动瞄准，松手掉落 · 相同水果合成升级</div>

  <!-- ======================== 排行榜 ======================== -->
  <div class="board-overlay" id="boardOverlay" hidden>
    <div class="board-panel">
      <div class="board-title">🏆 排行榜</div>
      <div class="board-tabs">
        <button type="button" class="board-tab active" id="tabRank">🏆 排行</button>
        <button type="button" class="board-tab" id="tabHistory">📜 记录</button>
      </div>
      <div class="board-tip" id="boardTip"></div>
      <div class="board-list" id="boardList"></div>
      <div class="board-foot">
        <button type="button" class="board-btn" id="boardRename">✏️ 改名</button>
        <span class="board-cur" id="boardName"></span>
        <button type="button" class="board-btn" id="boardAgain">↻ 再来一局</button>
      </div>
    </div>
  </div>
</div>
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.4.0/cloudbase.full.js"></script>

        imgLoaded[idx] = true;
        imagesDone++;
        if (imagesDone === PHOTO_DATA.length) allImagesReady = true;
      }

    img.onerror = function () {
      if (!remoteTried) {           // 内嵌图异常 → 用 jsdelivr 远程兜底
        remoteTried = true;
        img.crossOrigin = 'anonymous';
        img.src = REMOTE_BASE + PHOTO_SOURCES[idx];
      } else {                      // 都失败 → 永远用彩色+表情兜底渲染
        imagesDone++;
        if (imagesDone === PHOTO_DATA.length) allImagesReady = true;
      }
    };
    img.src = dataUri;              // 内嵌 base64，无需网络
  });

  // ======================== 状态 ========================

  // 提交本局得分（默认信息：昵称默认"玩家"，可点"改名"修改）
  function submitScore(sc) {
    const entry = { name: playerName, score: Math.max(0, sc), ts: Date.now() };
    // 全部记录：每次游戏结束都保存（保留最近 200 局，新→旧）
    history.unshift(entry);
    if (history.length > 200) history.length = 200;
    saveHistory();
    lastEntryTs = entry.ts;
    if (!(sc > 0)) return null;          // 0 分只进记录，不进排行榜
    board.push(entry);
    board.sort((a, b) => b.score - a.score || a.ts - b.ts);
    board = board.slice(0, 20);
    saveBoard();
    cloudSubmit(entry);   // 同步上传全球榜（未配置时为空操作）
    return entry;
  }

  function rankOf(list, ts) {
    for (let i = 0; i < list.length; i++) if (list[i].ts === ts) return i + 1;
    return -1;
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    const p = n => (n < 10 ? '0' + n : '' + n);
    return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderBoard(list, source) {

      boardList.innerHTML = '';

    else if (lastEntryTs) boardTip.textContent = '本局得分未进前 10，继续加油！';
    else boardTip.textContent = isCloud ? '🌐 全球榜（所有玩家实时同步）' : '点击「改名」修改昵称 · 按分数排行';

    const BADGE = ['🥇', '🥈', '🥉'];

  // ======================== 全球排行榜（腾讯云 CloudBase，可选） ========================
  // 让所有打开网址的人共用一个榜（国内访问最稳），配置步骤（约 10 分钟）：
  //   1. 微信扫码登录 https://cloud.tencent.com → 完成个人实名（微信+手机号）
  //   2. 搜索并开通「云开发 CloudBase」→ 创建环境（免费额度即可），记下「环境 ID」
  //   3. 控制台 → 数据库 → 新建集合，名称填 scores，权限选「所有用户可读，仅创建者可读写」
  //   4. 环境 → 登录授权 → 开启「匿名登录」
  //   5. 环境 → 安全配置 → Web 安全域名 → 添加 https://hsqjk0501.github.io
  //   6. 把「环境 ID」填到下面 CLOUD_ENV（形如 leaderboard-1a2b3c4d）
  // 未配置 = 自动使用本地排行榜，完全不影响游戏。
  const CLOUD_ENV = '';   // ← 在这里填你的 CloudBase 环境 ID

  // 上传本局得分（失败静默，不影响本地榜）
  function cloudSubmit(entry) {
    if (!CLOUD_ENV || typeof cloudbase === 'undefined') return;
    try {
      const app = cloudbase.init({ env: CLOUD_ENV });
      app.auth({ persistence: 'local' }).signInAnonymously()
        .then(function () {
          return app.database().collection('scores').add({
            name: entry.name, score: entry.score, ts: entry.ts
          });
        })
        .catch(function () {});
    } catch (e) {}
  }

  // 拉取全球前 10（失败返回 null → 界面自动回退本地榜）
  function cloudLoad() {
    if (!CLOUD_ENV || typeof cloudbase === 'undefined') return Promise.resolve(null);
    try {
      const app = cloudbase.init({ env: CLOUD_ENV });
      return app.auth({ persistence: 'local' }).signInAnonymously()
        .then(function () {
          return app.database().collection('scores').orderBy('score', 'desc').limit(10).get();
        })
        .then(function (res) {
          const rows = (res && res.data) || [];
          return rows.map(function (o) {
            return { name: o.name || '玩家', score: o.score || 0, ts: o.ts || 0 };
          });
        })
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }

  // ======================== 音频（WebAudio，可静音） ========================
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem('zffMuted') === '1'; } catch (e) {}
  soundBtn.textContent = muted ? '🔇' : '🔊';

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, dur, type, vol, slideTo, delay) {
    if (muted || !audioCtx) return;
    try {
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function playDrop()      { playTone(190, 0.05, 'sine', 0.05, 140); }
  function playLand(imp)   { playTone(85 + Math.random() * 40, 0.08, 'sine', Math.min(0.16, imp * 0.012), 55); }
  function playMerge(lvl)  {
    playTone(300 + lvl * 70, 0.14, 'sine', 0.2);
    playTone(600 + lvl * 140, 0.1, 'triangle', 0.1);
    if (lvl >= 8) playTone(900, 0.18, 'sine', 0.12, 1400);
  }
  function playGameOver() {
    playTone(440, 0.28, 'triangle', 0.14, 220, 0);
    playTone(330, 0.3,  'triangle', 0.14, 165, 0.28);

  // ======================== 工具 ========================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand  = (a, b) => a + Math.random() * (b - a);

  function randomLevel() { return Math.floor(Math.random() * 3); }

  function updateScoreDisplay() {
    scoreSpan.textContent = score;
    scoreSpan.classList.remove('score-pop');
    void scoreSpan.offsetWidth;      // 重新触发动画
    scoreSpan.classList.add('score-pop');

      try { localStorage.setItem('zffBest', String(bestScore)); } catch (e) {}
    }

  function createFruit(x, y, vx, vy, level, r) {
    return { x, y, vx, vy, level, r, active: true, squash: 0, squashVel: 0, rot: 0, rotVel: 0, born: 0 };
  }

  // 生成下一个瞄准水果（带弹入动画）
  function spawnAimFruit() {
    const lvl = nextLevel;         // 掉落预告里的等级
    nextLevel = randomLevel();     // 生成新的预告
    aimFruit = createFruit(
      clamp(CANVAS_W / 2, LEFT_WALL + RADII[lvl], RIGHT_WALL - RADII[lvl]),
      60, 0, 0, lvl, RADII[lvl]
    );
    aimFruit.born = performance.now();
    lastAimX = aimFruit.x;
  }

  function resetGame() {
    fruits = []; particles = []; floatTexts = [];
    score = 0; gameOver = false; shake = 0;
    aimFruit = null; aiming = false; pointerId = null; tilt = 0;
    spawnTimer = 6;
    combo = 0; comboTimer = 0;   // 清除连击
    lastEntryTs = 0;    // 清除上一局的高亮
    closeBoard();       // 关闭排行榜面板
    updateScoreDisplay();
    updateBest();
  }

  // ======================== 物理 ========================
  function physicsStep(dt) {
    // 1. 重力 + 移动（限速防穿透）
    for (const f of fruits) {
      f.vy += GRAVITY * dt;
      f.vx *= Math.pow(AIR_DRAG, dt);
      f.vy *= Math.pow(AIR_DRAG, dt);
      const sp = Math.hypot(f.vx, f.vy);
      if (sp > MAX_SPEED) { const k = MAX_SPEED / sp; f.vx *= k; f.vy *= k; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rotVel = f.vx * 0.015;
      f.rot += f.rotVel * dt;
    }

    // 2. 边界碰撞
    for (const f of fruits) {
      if (f.y + f.r > FLOOR_Y) {
        f.y = FLOOR_Y - f.r;
        if (f.vy > 0) {
          const impact = Math.abs(f.vy);
          if (impact > 0.8) {
            f.squashVel -= impact * 0.006;
            if (impact > landImpact) landImpact = impact;
          }
          f.vy = -f.vy * RESTITUTION;
          if (Math.abs(f.vy) < REST_THRESHOLD) f.vy = 0;
        }
        f.vx *= GROUND_FRICTION;
        if (Math.abs(f.vx) < 0.05) f.vx = 0;
      }
      if (f.x - f.r < LEFT_WALL)  { f.x = LEFT_WALL + f.r;  if (f.vx < 0) f.vx = -f.vx * WALL_BOUNCE; }
      if (f.x + f.r > RIGHT_WALL) { f.x = RIGHT_WALL - f.r; if (f.vx > 0) f.vx = -f.vx * WALL_BOUNCE; }
    }

    // 3. 水果互撞（迭代 3 遍：整堆多接触同时收敛，不留残余嵌入）
    const contacts = new Array(fruits.length).fill(0);
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 0; i < fruits.length; i++) {
        for (let j = i + 1; j < fruits.length; j++) {
          const a = fruits[i], b = fruits[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.r + b.r;
          if (dist === 0) continue;
          if (dist < minDist + 0.5) { contacts[i]++; contacts[j]++; }   // 接触计数（含恰好贴合，用于支撑锁定）
          if (dist >= minDist) continue;

          const nx = dx / dist, ny = dy / dist;
          const overlap = minDist - dist;
          const mA = a.r * a.r, mB = b.r * b.r, mTotal = mA + mB;

          // 位置修正（边界感知）：被地面/墙挡住的水果不动，对方承担全部修正
          // 否则"地面把球往上顶 + 碰撞把球往下推"会形成永不衰减的振荡（堆叠压缩）
          const corr = overlap * POS_CORRECT;
          const moveA = corr * (mB / mTotal);
          const moveB = corr * (mA / mTotal);
          const ax2 = a.x - nx * moveA, ay2 = a.y - ny * moveA;
          const bx2 = b.x + nx * moveB, by2 = b.y + ny * moveB;
          const aBlocked = ax2 - a.r < LEFT_WALL || ax2 + a.r > RIGHT_WALL || ay2 + a.r > FLOOR_Y;
          const bBlocked = bx2 - b.r < LEFT_WALL || bx2 + b.r > RIGHT_WALL || by2 + b.r > FLOOR_Y;
          if (aBlocked && !bBlocked) { b.x += nx * corr; b.y += ny * corr; }
          else if (bBlocked && !aBlocked) { a.x -= nx * corr; a.y -= ny * corr; }
          else { a.x -= nx * moveA; a.y -= ny * moveA; b.x += nx * moveB; b.y += ny * moveB; }

          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn > 0) continue;

          // 冲量：被挡住的一方按"无限质量"处理，对方承担全部反弹
          const jImp = -(1 + FRUIT_BOUNCE) * vn / (1 / mA + 1 / mB);
          if (aBlocked && !bBlocked) {
            b.vx += -(1 + FRUIT_BOUNCE) * vn * nx;
            b.vy += -(1 + FRUIT_BOUNCE) * vn * ny;
          } else if (bBlocked && !aBlocked) {
            a.vx -= -(1 + FRUIT_BOUNCE) * vn * nx;
            a.vy -= -(1 + FRUIT_BOUNCE) * vn * ny;
          } else {
            a.vx -= (jImp * nx) / mA; a.vy -= (jImp * ny) / mA;
            b.vx += (jImp * nx) / mB; b.vy += (jImp * ny) / mB;
          }

          const impact = Math.abs(vn);
          if (impact > 0.8) { a.squashVel -= impact * 0.005; b.squashVel -= impact * 0.005; }
        }
      }
    }

    // 4. 静止锁定 + 接触阻尼：
    //    - 接触中的球：速度按 0.985 衰减（压住"永动互弹"的持续泵能）
    //    - 有支撑且低速的球：直接停住（绝不冻结空中球，否则下落变慢）
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      const sp2 = Math.abs(f.vx) + Math.abs(f.vy);
      if (sp2 >= 1.4) continue;                  // 快速运动（下落/撞击）不干预
      const onFloor = f.y + f.r >= FLOOR_Y - 0.5;
      const supported = onFloor || contacts[i] > 0;
      if (!supported) continue;                  // 空中球不锁定（防止冻在半空、下落变慢）
      if (sp2 < 0.85) { f.vx = 0; f.vy = 0; }    // 有支撑且较慢 → 直接停住
      else { f.vx *= 0.9; f.vy *= 0.9; }         // 有支撑的中速球衰减至停住
    }
  }

  function updatePhysics() {
    const dt = 1 / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) physicsStep(dt);
  }

  // 视觉挤压弹簧
  function updateSquash() {
    for (const f of fruits) {
      f.squashVel += (0 - f.squash) * 0.32;
      f.squashVel *= 0.72;
      f.squash += f.squashVel;
      f.squash = clamp(f.squash, -0.15, 0.1);   // 轻微Q弹，避免照片变形
    }
  }

  // ======================== 合成 ========================
  function mergeFruits() {
    const merged = new Array(fruits.length).fill(false);
    const newFruits = [];

    for (let i = 0; i < fruits.length; i++) {
      if (merged[i]) continue;
      const a = fruits[i];
      for (let j = i + 1; j < fruits.length; j++) {
        if (merged[j]) continue;
        const b = fruits[j];
        if (a.level !== b.level || a.level >= 10) continue;
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (dist < a.r + b.r) {
          merged[i] = merged[j] = true;
          const lvl = a.level + 1;
          const newR = RADII[lvl];
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const nf = createFruit(mx, my, (a.vx + b.vx) * 0.3, -2.6, lvl, newR);
          nf.squashVel = 0.18;         // 合成瞬间轻微压扁回弹
          newFruits.push(nf);

          // 连击：连击窗口内连续合成 → 连击数+1，每个连击多加 10 分
          if (comboTimer > 0) combo++; else combo = 1;
          comboTimer = COMBO_WINDOW;
          const comboBonus = (combo - 1) * 10;
          const gain = SCORES[lvl] + (lvl === 10 ? 50 : 0) + comboBonus;
          score += gain;
          updateScoreDisplay();

          // 特效：粒子迸发 + 飘分（含连击提示）+ 大合成震屏
          burstParticles(mx, my, COLORS[lvl % COLORS.length], 10 + lvl * 2);
          addFloatText(mx, my - 12,
            (lvl === 10 ? '+' + gain + ' 🎉' : '+' + gain) + (combo > 1 ? '  连击x' + combo : ''));
          if (lvl >= 6) shake = Math.min(10, shake + 2 + lvl * 0.3);
          playMerge(lvl);
          break;
        }
      }
    }

    const remaining = [];
    for (let i = 0; i < fruits.length; i++) if (!merged[i]) remaining.push(fruits[i]);
    fruits = remaining.concat(newFruits);
  }

  function checkGameOver() {
    for (const f of fruits) {
      if (f.y - f.r < 20 && Math.abs(f.vy) < 0.5) return true;
    }
    return false;
  }

  // ======================== 特效 ========================
  function burstParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2), sp = rand(1, 4.5);
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 1.5,
        r: rand(1.5, 3.5),
        life: rand(18, 32), maxLife: 32,
        color
      });
    }
  }
  function addFloatText(x, y, text) {
    floatTexts.push({ x, y, text, life: 40, vy: -0.7, color: '#ffd966' });
  }
  function updateEffects() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.vx *= 0.98;
      if (--p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const t = floatTexts[i];
      t.y += t.vy;
      if (--t.life <= 0) floatTexts.splice(i, 1);
    }
    shake *= 0.88;
    if (shake < 0.05) shake = 0;
  }

  // ======================== 绘制 ========================
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // 以 (0,0) 为中心绘制水果本体（含挤压/旋转/裁剪/贴图）
  function drawFruitBody(f) {
    const { r, level, squash, rot } = f;
    const sx = 1 + squash, sy = 1 - squash * 0.8;

    ctx.save();
    ctx.rotate(rot * 0.06);
    ctx.scale(sx, sy);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    const img = fruitImages[level];
    if (img && imgLoaded[level]) {
      try { ctx.drawImage(img, -r, -r, r * 2, r * 2); }
      catch (e) { fallbackFruit(r, level); }
    } else {
      fallbackFruit(r, level);
    }
    ctx.restore();

    // 高光已移除：照片不是水果，不需要模拟光泽

    // 描边（不挤压，保持圆感）
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,240,0.85)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawFruit(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    drawFruitBody(f);
    ctx.restore();
  }

  function fallbackFruit(r, level) {
    const g = ctx.createRadialGradient(-4, -4, r * 0.2, 0, 0, r);
    g.addColorStop(0, '#fff8e7');
    g.addColorStop(0.75, COLORS[level % COLORS.length]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = r * 0.8 + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1e1e1e';
    ctx.fillText(EMOJIS[level], 0, r * 0.05);
  }

  // 预测落点：从瞄准水果正下方找第一个能停住的位置（幽灵落点）
  function predictLandingY(f) {
    let gy = FLOOR_Y - f.r;              // 兜底：地面
    for (const o of fruits) {
      if (o.y - o.r < f.y - f.r) continue;    // 落点之上的水果不算
      if (Math.abs(o.x - f.x) < f.r + o.r * 0.7) {   // 水平方向有重叠
        const y = o.y - o.r - f.r;       // 停在该水果上面
        if (y < gy) gy = y;
      }
    }
    return Math.max(f.y, gy);            // 不低于当前瞄准高度
  }

  function draw() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    // 地面
    ctx.fillStyle = '#dac29b'; ctx.fillRect(0, FLOOR_Y, CANVAS_W, 15);
    ctx.fillStyle = '#b5986b'; ctx.fillRect(0, FLOOR_Y, CANVAS_W, 6);

    // 危险线（水果顶部超过此线且静止 = 游戏结束）
    ctx.save();
    ctx.setLineDash([10, 6]);
    ctx.strokeStyle = 'rgba(214,48,49,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(LEFT_WALL, 20);
    ctx.lineTo(RIGHT_WALL, 20);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(214,48,49,0.7)';
    ctx.font = 'bold 10px "Segoe UI",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('⚠ 危险线', LEFT_WALL + 4, 18);
    ctx.restore();

    // 下一个预告（右上角小图标）
    ctx.save();
    ctx.translate(CANVAS_W - 34, 38);
    ctx.beginPath();
    ctx.arc(0, 0, 19, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(61,43,26,0.5)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#fcf3e2';
    ctx.fill();
    drawFruitBody({ r: 13, level: nextLevel, squash: 0, rot: 0 });
    ctx.restore();
    ctx.fillStyle = '#6b4f2e';
    ctx.font = 'bold 9px "Segoe UI",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('下一个', CANVAS_W - 12, 62);

    for (const f of fruits) drawFruit(f);

    // 瞄准辅助：虚线 + 幽灵落点 + 待落水果（弹入动画）
    if (aimFruit && !gameOver) {
      const f = aimFruit;
      const gy = predictLandingY(f);
      ctx.beginPath();
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(165,135,90,0.55)';
      ctx.lineWidth = 2;
      ctx.moveTo(f.x, 60);
      ctx.lineTo(f.x, gy + 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 幽灵落点：半透明预览真正会停住的位置
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.translate(f.x, gy);
      drawFruitBody(f);
      ctx.restore();

      ctx.save();
      ctx.translate(f.x, f.y);
      const t = Math.min(1, (performance.now() - f.born) / 200);
      const s = easeOutBack(t);
      ctx.scale(s, s);
      ctx.rotate(tilt * 0.35);
      drawFruitBody(f);
      ctx.restore();
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 飘分
    for (const t of floatTexts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life / 14));
      ctx.font = 'bold 16px "Segoe UI",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(61,43,26,0.9)';
      ctx.lineWidth = 3;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    // 照片加载提示（不阻塞游戏，加载好自动替换成照片）
    if (!allImagesReady) {
      ctx.font = '11px "Segoe UI",sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(107,79,46,0.75)';
      ctx.fillText('照片加载中 ' + imagesDone + '/' + PHOTO_SOURCES.length + '…', LEFT_WALL + 4, FLOOR_Y - 4);
    }

    // 游戏结束
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd966';
      ctx.font = 'bold 34px "Segoe UI",sans-serif';
      ctx.fillText('游戏结束', CANVAS_W / 2, CANVAS_H / 2 - 70);
      ctx.fillStyle = '#f5e7c8';
      ctx.font = 'bold 20px "Segoe UI",sans-serif';
      ctx.fillText('得分 ' + score, CANVAS_W / 2, CANVAS_H / 2 - 20);
      ctx.fillStyle = '#e6c28b';
      ctx.font = '16px "Segoe UI",sans-serif';
      ctx.fillText('最高 ' + bestScore, CANVAS_W / 2, CANVAS_H / 2 + 14);
      ctx.fillStyle = '#ffd966';
      ctx.font = 'bold 17px "Segoe UI",sans-serif';
      ctx.fillText('👆 点击任意处 再来一局', CANVAS_W / 2, CANVAS_H / 2 + 56);
    }

    ctx.restore();
  }

  // ======================== 交互（Pointer Events，鼠标/触屏统一） ========================
  function getX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) * (CANVAS_W / rect.width);
  }

  function onDown(e) {
    ensureAudio();
    e.preventDefault();
    if (gameOver) { resetGame(); return; }      // 游戏结束后点击画布直接重开
    if (!aimFruit) return;
    aiming = true;
    pointerId = e.pointerId;
    lastAimX = aimFruit.x;
    tilt = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onMove(e) {
    if (!aiming || !aimFruit || e.pointerId !== pointerId) return;
    e.preventDefault();
    const x = clamp(getX(e), LEFT_WALL + aimFruit.r, RIGHT_WALL - aimFruit.r);
    const dx = x - aimFruit.x;
    aimFruit.x = x;
    tilt = clamp(dx * 0.12, -0.5, 0.5);          // 拖动时轻微倾斜，有手感
  }

  // 松手/取消：把“瞄准的水果本体”直接丢进物理世界 —— 没有克隆、没有复制
  function onUp(e) {
    if (pointerId === null || e.pointerId !== pointerId) return;
    if (!gameOver && aiming && aimFruit) dropFruit();
    aiming = false;
    pointerId = null;
    tilt = 0;
  }

  function dropFruit() {
    const f = aimFruit;
    aimFruit = null;
    aiming = false;
    f.vy = 1.2;
    f.squashVel = 0.06;
    fruits.push(f);                 // 同一个对象，下落的就是你瞄准的那颗
    spawnTimer = SPAWN_DELAY;       // 稍等片刻再出现下一颗，避免连点误触
    tilt = 0;
    playDrop();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('restartButton').addEventListener('click', resetGame);

  // ======================== 主循环（固定时间步 + 累加器） ========================
  let lastTime = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;

  function tick() {
    if (paused) return;              // 排行榜打开时暂停
    // 连击窗口计时（窗口结束清零）
    if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }
    // 掉落后生成下一个水果
    if (spawnTimer > 0) {
      spawnTimer--;
      if (spawnTimer === 0 && !gameOver) spawnAimFruit();
    }
    if (!gameOver) {
      landImpact = 0;
      updatePhysics();
      mergeFruits();
      updatePhysics();
      mergeFruits();
      updateSquash();
      updateEffects();
      if (landImpact > 1.2) playLand(landImpact);
      if (checkGameOver()) {
        gameOver = true;
        updateBest();
        playGameOver();
        submitScore(score);   // 本局得分上榜（默认昵称"玩家"）
        showBoard();          // 自动弹出排行榜
      }
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;          // 切后台回来不疯狂补帧
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 4) {
      acc -= STEP;
      tick();
      steps++;
    }
    draw();
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
